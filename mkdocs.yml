site_name: EORL Lab
site_description: "Executable Organizational Routine Laboratory — a researcher's guide and API reference."
repo_url: https://github.com/agrimsachdeva/eorl_lab
repo_name: agrimsachdeva/eorl_lab
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy
    - content.action.edit

nav:
  - Home: index.md
  - Researcher Guide:
      - Getting Started: guide/getting-started.md
      - Core Concepts (Five Layers): guide/core-concepts.md
      - Architectures & Agents: guide/architectures-and-agents.md
      - Model Providers: guide/model-providers.md
      - Memory Types: guide/memory-types.md
      - Building an Experiment: guide/building-an-experiment.md
      - Factorial Designs & Ablations: guide/factorial-and-ablations.md
      - Counterfactual Branching: guide/branching.md
      - Constructs & Theory: guide/constructs.md
      - Using the Front End: guide/front-end.md
      - Statistical Analysis: guide/statistical-analysis.md
      - Reproducibility & Export: guide/reproducibility.md
      - Stage 1 Additions: guide/stage1-additions.md
  - DocType Reference: doctypes/index.md
  - API Reference:
      - Overview: reference/index.md
      - Runtime (orchestrator, authority): reference/runtime.md
      - Providers (deterministic, LLM, factory): reference/providers.md
      - Memory (episodic, semantic, procedural, ...): reference/memory.md
      - ERP Tools: reference/erp.md
      - Organization (communication, control): reference/organization.md
      - Analysis (process mining & metrics): reference/analysis.md
      - Scenarios: reference/scenarios.md
      - Observability (events, context): reference/observability.md
      - Whitelisted API (eorl_lab.api): reference/api.md
  - Project History:
      - SOTA Roadmap (V2): history/sota-roadmap.md
      - Progress (V1 Milestones): history/progress.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            members_order: source
            separate_signature: true
            show_signature_annotations: true
